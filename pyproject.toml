[project]
name = "decision-advisor"
version = "0.18"
description = "Personal Growth Decision Advisor & Memory Engine (Embedded macOS App + 24/7 VPS Remote API & MCP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "fastembed>=0.5.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
