const D = window.DA, I = window.ICON;
const S = { section: "chat", mode: "decision", session: "s1", mem: "m3", memTab: "列表", cat: "全部", mood: "迷茫", asOf: false, sensitive: false, insp: true };
const moodColor = { 平静: "#8FB8D8", 开心: "#F5C04A", 焦虑: "#E8875A", 疲惫: "#A9A3B8", 委屈: "#C98BB4", 迷茫: "#9C9FE0", 释然: "#6CC4A1" };

function side() {
  return `
  <div class="lights"><i></i><i></i><i></i><button class="gb" title="隐藏侧边栏 ⌘\\">${I("sidebar", 16)}</button></div>
  <div class="sfield">${I("search", 13)} 搜索对话与记忆 <span>⌘K</span></div>
  <div class="slist">
    ${D.sections.map(s => `<button class="row ${S.section === s.id ? "on" : ""}" onclick="go('${s.id}')">${I(s.icon, 16)}${s.name}${s.badge ? `<span class="ct">${s.badge}</span>` : ""}</button>`).join("")}
    <h6 style="display:flex">最近对话<span style="margin-left:auto;cursor:pointer" title="新建对话 ⌘N">${I("plus", 13)}</span></h6>
    ${D.sessions.map(s => {
      const m = D.modes.find(x => x.id === s.mode);
      return `<button class="row sess ${S.section === "chat" && S.session === s.id ? "on" : ""}" onclick="openSess('${s.id}')">
        <span class="mi">${I(m.icon, 13)}</span><span class="tt"><b>${s.title}</b><small>${m.name} · ${s.time}</small></span></button>`;
    }).join("")}
  </div>
  <div class="sfoot"><span class="status"><i></i>内置引擎</span><small>${D.stats.total} 记忆 · ${D.stats.vectors} 向量</small></div>`;
}

const model = () => `<button class="capsule model"><i></i>ChatGPT 订阅 · gpt-6 ${I("updown", 12)}</button>`;
const inspBtn = () => `<div class="capsule"><button class="gb ${S.insp ? "on" : ""}" onclick="S.insp=!S.insp;render()" title="检查器">${I("inspector", 16)}</button></div>`;

function chat() {
  const m = D.modes.find(x => x.id === S.mode), c = D.conversation, sess = D.sessions.find(s => s.id === S.session);
  const live = S.mode === "decision" && S.session === "s1";
  const seg = `<div class="capsule seg">${D.modes.map(x => `<button class="${x.id === S.mode ? "on" : ""}" onclick="S.mode='${x.id}';render()">${I(x.icon, 13)}${x.name}</button>`).join("")}</div>`;
  const tb = `<div class="tb"><div class="ttl"><b>${live ? sess.title : "新对话"}</b><small>${live ? `${m.name} · ${sess.count} 条消息` : m.name}</small></div><span class="sp"></span>${seg}<span class="sp"></span>${model()}${inspBtn()}</div>`;
  let body;
  if (live) {
    body = `
      <div class="ubub">${c.user}</div>
      <div class="ameta"><span class="av">${I("leaf", 13, 2)}</span><b>顾问</b> · 16:42</div>
      <details class="think"><summary><span class="chev">${I("chevron", 12)}</span>${I("sparkle", 13)} 思考过程<span class="sp"></span>检索 7 篇 · 4.2 秒</summary><ul>${c.thinking.map(t => `<li>${t}</li>`).join("")}</ul></details>
      <div class="ans">${c.reply.map(r => `<div class="blk"><span class="tag t-${r.tag}">${r.tag}</span><div>${r.text}${r.ref ? `<a href="#">[[${r.ref}]]</a>` : ""}</div></div>`).join("")}</div>
      <div class="refs">${c.refs.map(r => `<div class="ref"><span class="ic">${I("book", 12)}</span><div>${r.title}<br><small>${r.cat} · ${r.score}</small></div></div>`).join("")}</div>
      <div class="acts"><button>${I("copy", 13)} 复制</button><button>${I("refresh", 13)} 重新生成</button><button class="pri">${I("sparkle", 13)} 提炼记忆</button></div>`;
  } else {
    const st = { chat: ["聊聊今天的经历与感受", "延续「开会被打断」", "梳理“落后感”"], decision: ["开始一次 9 步决策", "复盘「离开创业公司」", "画画课要不要续费"], interview: ["开始冷启动访谈", "补充人生章节", "更新价值排序"], reflect: ["整理收件箱 · 4 条", "回看 11 月情绪", "我和母亲的这一年"] }[S.mode];
    body = `<div class="hero"><div class="orb">${I(m.icon, 30, 1.8)}</div><h2>${m.title}</h2><p>${m.desc} · ${D.stats.total} 篇记忆随时参与思考</p>
      <div class="cards">${st.map((t, i) => `<button class="card">${I(["sparkle", "clock", "compass"][i], 18)}<b>${t}</b>点击即可开始，顾问会先读取核心自我。</button>`).join("")}</div></div>`;
  }
  const insp = S.insp ? `<aside class="insp">
      <h5>检索上下文</h5>
      <div class="grp">
        <div>${I("clock", 14)} 按历史日期回溯<span class="r">${S.asOf ? "2023-03-01" : ""}<span class="sw ${S.asOf ? "on" : ""}" onclick="S.asOf=!S.asOf;render()"></span></span></div>
        <div>${I("shield", 14)} 本轮允许敏感记忆<span class="r"><span class="sw ${S.sensitive ? "on" : ""}" onclick="S.sensitive=!S.sensitive;render()"></span></span></div>
      </div>
      <h5>本轮引用<span>${c.refs.length} 篇</span></h5>
      <div class="grp">${c.refs.map(r => `<div class="refrow"><b>${r.title}</b><small>${r.cat} · 相似度 ${r.score}</small><div class="bar2"><i style="width:${r.score * 100}%"></i></div></div>`).join("")}
        <div style="color:#A93442;font-size:11.5px">${I("lock", 13)} 1 篇敏感记忆已拦截</div></div>
      ${S.mode === "decision" ? `<h5>9 步协议<span>9 / 9</span></h5><div>${D.decisionSteps.map(s => `<div class="chk"><i>${I("check", 10, 3)}</i>${s}</div>`).join("")}</div>` : ""}
      <button class="bigbtn">${I("sparkle", 14)} 提炼记忆提案</button>
    </aside>` : "";
  return tb + `<div class="body"><div class="center"><div class="scroll"><div class="col">${body}</div></div>
    <div class="composer"><div class="cbox"><textarea placeholder="${m.ph}"></textarea>
      <div class="cr"><button class="gb">${I("plus", 16)}</button>
        <button class="ctog ${S.asOf ? "on" : ""}" onclick="S.asOf=!S.asOf;render()">${I("clock", 13)} ${S.asOf ? "回溯 2023-03-01" : "回溯"}</button>
        <button class="ctog ${S.sensitive ? "on" : ""}" onclick="S.sensitive=!S.sensitive;render()">${I("shield", 13)} ${S.sensitive ? "敏感已放行" : "敏感保护"}</button>
        <button class="sendb" title="发送 ⌘↩">${I("arrowUp", 16, 2.2)}</button></div></div></div>
  </div>${insp}</div>`;
}

function memories() {
  const seg = `<div class="capsule seg">${[["列表", "list"], ["语义", "search"], ["时间轴", "timeline"], ["图谱", "graph"]].map(([t, ic]) => `<button class="${S.memTab === t ? "on" : ""}" onclick="S.memTab='${t}';render()">${I(ic, 13)}${t}</button>`).join("")}</div>`;
  const tb = `<div class="tb"><div class="ttl"><b>记忆库</b><small>${D.stats.total} 篇 · ${D.stats.edges} 条关联 · ${D.stats.sensitive} 篇敏感</small></div><span class="sp"></span>${seg}<span class="sp"></span><div class="capsule"><button class="gb" title="新建">${I("plus", 16)}</button></div>${inspBtn()}</div>`;
  const cats = ["全部", "00-核心自我", "01-人生章节", "02-经历与感受", "03-重要关系", "04-决策实验室", "05-认知演进"];
  let content;
  if (S.memTab === "时间轴") {
    content = `<div class="htl"><div class="track">${D.timeline.map(t => `<div class="ev ${t.imp >= 8 ? "hi" : ""}"><small>${t.date}</small><b>${t.title}</b><span>${t.cat} · ★${t.imp}</span></div>`).join("")}</div></div>`;
  } else if (S.memTab === "图谱") {
    content = graph();
  } else {
    const list = D.memories.filter(x => S.cat === "全部" || x.cat === S.cat);
    content = `${S.memTab === "语义" ? `<div style="padding:4px 20px 12px"><div class="sfield" style="margin:0;background:rgba(255,255,255,.7);padding:10px 12px;font-size:13px">${I("sparkle", 14)} 被否定后的焦虑……（中文向量 + 图谱召回）</div></div>` : ""}
      <div class="filters">${cats.map(c => `<button class="${S.cat === c ? "on" : ""}" onclick="S.cat='${c}';render()">${c.replace(/^\d+-/, "")}</button>`).join("")}</div>
      <div class="mgrid">${list.map(x => `<button class="mc ${S.mem === x.id ? "on" : ""}" onclick="S.mem='${x.id}';S.insp=true;render()">
        <div class="top">${x.cat}${x.privacy === "sensitive" ? `<span class="lockb">敏感</span>` : ""}<span class="st">★ ${x.importance}</span></div>
        <h4>${x.title}</h4><p>${x.excerpt}</p>
        <div class="emo">${x.emotions.map(e => `<span style="background:${(moodColor[e] || "#bbb")}33">${e}</span>`).join("")}<span>${x.date.slice(0, 7)}</span></div></button>`).join("")}</div>`;
  }
  const mm = D.memories.find(x => x.id === S.mem);
  const insp = S.insp ? `<aside class="insp dt">
    <h5>${mm.cat}<span>★ ${mm.importance}/10</span></h5>
    <h3>${mm.title}</h3><div class="sub">发生于 ${mm.date} · ${mm.privacy} · ${mm.people.join("、") || "无人物"}</div>
    ${mm.id === "m3" ? D.detail.body.filter(b => b[0] !== "kv").map(([t, v]) => t === "h" ? `<h5>${v}</h5>` : t === "q" ? `<blockquote>“${v}”</blockquote>` : `<p>${v}</p>`).join("") : `<p>${mm.excerpt}</p>`}
    <h5>情绪结构</h5><div class="grp">${D.detail.body.find(b => b[0] === "kv")[1].map(r => `<div>${r[0]}<span class="r">${r[1]}</span></div>`).join("")}</div>
    <h5>双链关联</h5><div class="grp">${D.detail.links.map(l => `<div class="lnk">${I("link", 13)} ${l}</div>`).join("")}</div>
    <button class="bigbtn">${I("edit", 14)} 编辑 Markdown 原文</button>
  </aside>` : "";
  return tb + `<div class="body"><div class="center"><div class="scroll" style="padding-bottom:20px">${content}</div></div>${insp}</div>`;
}

function graph() {
  const n = [[300, 130, "身体警报", 14], [170, 230, "离开创业公司", 12], [440, 230, "values", 16], [300, 330, "照顾自己", 11], [110, 360, "阿哲", 9], [500, 370, "母亲", 9], [250, 440, "北漂第一章", 10]];
  const e = [[0, 1], [0, 2], [0, 3], [1, 4], [1, 6], [3, 2], [5, 2], [4, 6]];
  return `<svg viewBox="0 0 620 500" style="width:100%;height:100%;min-height:440px">
    <defs><radialGradient id="g"><stop offset="0" stop-color="#5DB596"/><stop offset="1" stop-color="#2C7A64"/></radialGradient></defs>
    ${e.map(([a, b]) => `<line x1="${n[a][0]}" y1="${n[a][1]}" x2="${n[b][0]}" y2="${n[b][1]}" stroke="rgba(44,122,100,.35)" stroke-width="1.5"/>`).join("")}
    ${n.map(x => `<circle cx="${x[0]}" cy="${x[1]}" r="${x[3] + 8}" fill="rgba(255,255,255,.7)" stroke="rgba(0,0,0,.06)"/><circle cx="${x[0]}" cy="${x[1]}" r="${x[3]}" fill="url(#g)"/>
      <text x="${x[0]}" y="${x[1] + x[3] + 24}" text-anchor="middle" font-size="12.5" font-family="-apple-system,PingFang SC" fill="#1C1F1E">${x[2]}</text>`).join("")}
  </svg>`;
}

function inbox() {
  const tb = `<div class="tb"><div class="ttl"><b>速记收件箱</b><small>99-收件箱/inbox.md · ${D.inbox.length} 条待整理</small></div><span class="sp"></span><button class="capsule model" style="color:var(--accent);font-weight:600">${I("sparkle", 13)} 让 AI 整理入库</button></div>`;
  return tb + `<div class="scroll" style="padding:0 24px 40px">
    <div class="capture"><h2>10 秒捕捉此刻</h2><p>选一个心情，写一句话。之后在周期反思里一键整理入库。</p>
      <div class="moods">${D.moods.map(m => `<button class="md ${S.mood === m ? "on" : ""}" onclick="S.mood='${m}';render()"><i style="background:${moodColor[m]}"></i>${m}</button>`).join("")}</div>
      <textarea placeholder="记下此刻的感受、发生的小事，或脑海里闪过的一个念头…"></textarea>
      <div class="crow2">${I("cloud", 13)} 追加至本地 inbox.md · 自动同步 iCloud<button class="pbtn">存入收件箱 ⌘↩</button></div></div>
    <div class="notes">${D.inbox.map(e => `<div class="note"><div class="h"><i style="background:${moodColor[e.mood]}"></i><b>${e.mood}</b>${e.time}</div><p>${e.text}</p></div>`).join("")}</div>
  </div>`;
}

function settings() {
  const tb = `<div class="tb"><div class="ttl"><b>模型与设置</b><small>v${D.version}</small></div></div>`;
  return tb + `<div class="scroll" style="padding:0 24px 40px"><div class="setw">
    <h5>后端连接</h5><div class="grp">
      <div><span class="ico" style="background:#2C7A64">${I("desktop", 15)}</span><div>App 内置后端<span class="desc">随开随启，直读本机 iCloud 记忆</span></div><span class="r"><span class="radio on"></span></span></div>
      <div><span class="ico" style="background:#4A7BD0">${I("cloud", 15)}</span><div>远程 VPS<span class="desc">24/7 常驻，与手机端、ChatGPT MCP 共享</span></div><span class="r"><span class="radio"></span></span></div>
    </div>
    <h5>模型</h5><div class="grp">${D.providers.map((p, i) => `<div><span class="ico" style="background:${["#10A37F", "#C96442", "#4D6BFE"][i]}">${I("sparkle", 14)}</span><div>${p.name}<span class="desc">${p.model}</span></div><span class="r">${p.ok ? "已授权" : "未填 Key"}<button class="sbtn">${i === 0 ? "重新授权" : "配置…"}</button></span></div>`).join("")}</div>
    <h5>隐私与写入</h5><div class="grp">
      <div><span class="ico" style="background:#D0453F">${I("shield", 15)}</span>默认拦截 sensitive 记忆<span class="r"><span class="sw on"></span></span></div>
      <div><span class="ico" style="background:#8E8E93">${I("clock", 15)}</span>每次写入自动 Git 快照<span class="r"><span class="sw on"></span></span></div>
      <div><span class="ico" style="background:#E3A21A">${I("edit", 15)}</span>核心自我变更强制显示 Diff<span class="r"><span class="sw on"></span></span></div>
    </div>
    <h5>索引</h5><div class="grp">
      <div>向量模型<span class="r">BAAI/bge-small-zh-v1.5</span></div>
      <div>已嵌入<span class="r">${D.stats.vectors} / ${D.stats.total}<button class="sbtn">重建索引</button></span></div>
    </div></div></div>`;
}

function render() {
  document.getElementById("side").innerHTML = side();
  document.getElementById("main").innerHTML = { chat, memories, inbox, settings }[S.section]();
}
function go(s) { S.section = s; render(); }
function openSess(id) { S.section = "chat"; S.session = id; S.mode = D.sessions.find(s => s.id === id).mode; render(); }
document.addEventListener("keydown", e => { if (e.metaKey && "1234".includes(e.key)) { e.preventDefault(); go(D.sections[+e.key - 1].id); } });
render();
</script>
</body>
</html>
